[pytest]
testpaths = backend/tests
pythonpath = backend
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --tb=short
markers =
    unit: fast unit tests for pure logic and helpers
    api: HTTP endpoint integration tests using Flask test client
    performance: latency, caching, and NFR performance verification tests
