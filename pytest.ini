[pytest]
testpaths = backend/tests
pythonpath = backend
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --tb=short
markers =
    smoke: ultra-fast critical health, boot, and core endpoint sanity checks
    unit: fast isolated unit tests for pure logic, validation, and helpers
    integration: Flask API, persistence, and multi-component integration tests
    api: HTTP endpoint contract tests using Flask test client
    security: authentication, XSS, CORS, HTTPS, and rate-limiting security tests
    performance: heavy concurrency, thread-safety, and 500-user load benchmarks
    slow: slower tests excluded from pre-commit and fast local runs
