name: Mahjar Parents Free-Tier CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      run_performance:
        description: "Run heavy performance & 500-user load benchmarks"
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      performance: ${{ steps.filter.outputs.performance }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      - name: Determine test scopes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "performance=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "performance=${{ inputs.run_performance }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" || true)
          echo "Changed files in PR:"
          echo "$CHANGED_FILES"

          if printf '%s\n' "$CHANGED_FILES" | grep -qE '^(backend/|pytest\.ini$|Dockerfile$|Procfile$|render\.yaml$|\.github/workflows/ci-cd\.yml$)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$CHANGED_FILES" | grep -qE '^(frontend/|vercel\.json$|netlify\.toml$|\.github/workflows/ci-cd\.yml$)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$CHANGED_FILES" | grep -qE '^(backend/load_benchmark\.py$|backend/tests/performance/|backend/gunicorn\.conf\.py$)'; then
            echo "performance=true" >> "$GITHUB_OUTPUT"
          else
            echo "performance=false" >> "$GITHUB_OUTPUT"
          fi

  backend-verify:
    name: Backend Tests & Free-Tier Packaging
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Fast gate (smoke + unit)
        run: pytest -m "smoke or unit" -q

      - name: Integration & security gate (excluding heavy performance)
        run: pytest -m "integration and not performance and not slow" -q

      - name: Verify production WSGI boot with SQLite persistence
        env:
          MAHJAR_ENV: production
          MAHJAR_SECRET_KEY: ci-verification-secret-key-at-least-32-chars!!
          MAHJAR_ADMIN_USERNAME: admin
          MAHJAR_ADMIN_PASSWORD_HASH: scrypt:32768:8:1$ciVerificationSalt$0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          MAHJAR_CORS_ALLOWED_ORIGINS: https://mahjar-parents.vercel.app
          MAHJAR_STORAGE_BACKEND: sqlite
          MAHJAR_DATA_DIR: /tmp/mahjar-ci-data
        run: |
          python -c "import sys; sys.path.insert(0, 'backend'); import wsgi; client = wsgi.app.test_client(); assert client.get('/api/health').status_code == 200; r = client.get('/api/ready'); assert r.status_code == 200 and r.get_json()['storage']['backend'] == 'sqlite' and r.get_json()['media']['rawAvStorageAllowed'] is False"

  frontend-build-verify:
    name: Frontend Tests & Vite Production Build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend test suite
        working-directory: frontend
        run: npm test

      - name: Build & verify free-tier static bundle (no raw A/V)
        working-directory: frontend
        run: npm run build && npm run build:verify

      - name: Upload built dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: mahjar-frontend-dist
          path: frontend/dist
          retention-days: 7

  backend-performance:
    name: Backend Performance & 500-User Benchmark
    needs: [changes, backend-verify]
    if: always() && needs.changes.outputs.performance == 'true' && (needs.backend-verify.result == 'success' || needs.backend-verify.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run performance & concurrency suite
        run: pytest -m "performance" -q

      - name: Run 500-concurrent-user load & latency benchmark
        run: python backend/load_benchmark.py --users 500 --storage sqlite

  ci-gate:
    name: CI Quality Gate
    needs: [backend-verify, frontend-build-verify, backend-performance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate upstream CI job statuses
        run: |
          for result in \
            "${{ needs.backend-verify.result }}" \
            "${{ needs.frontend-build-verify.result }}" \
            "${{ needs.backend-performance.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "CI Quality Gate failed: upstream job finished with '$result'."
              exit 1
            fi
          done
          echo "CI Quality Gate passed."

  deploy-free-tier:
    name: Trigger Free-Tier Deploy Hooks
    needs: [ci-gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger optional Render / Vercel deploy hooks
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          fi
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
          fi
