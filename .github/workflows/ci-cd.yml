name: Mahjar Parents Free-Tier CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-verify:
    name: Backend Tests & Free-Tier Packaging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install --no-cache-dir -r backend/requirements.txt

      - name: Run pytest suite
        run: pytest -q

      - name: Run 500-concurrent-user load & latency benchmark
        run: python backend/load_benchmark.py --users 500 --storage sqlite

      - name: Verify production WSGI boot with SQLite persistence
        env:
          MAHJAR_ENV: production
          MAHJAR_SECRET_KEY: ci-verification-secret-key-at-least-32-chars!!
          MAHJAR_ADMIN_USERNAME: admin
          MAHJAR_ADMIN_PASSWORD_HASH: scrypt:32768:8:1$ciVerificationSalt$0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          MAHJAR_CORS_ALLOWED_ORIGINS: https://mahjar-parents.vercel.app
          MAHJAR_STORAGE_BACKEND: sqlite
          MAHJAR_DATA_DIR: /tmp/mahjar-ci-data
        run: |
          python -c "import sys; sys.path.insert(0, 'backend'); import wsgi; client = wsgi.app.test_client(); assert client.get('/api/health').status_code == 200; r = client.get('/api/ready'); assert r.status_code == 200 and r.get_json()['storage']['backend'] == 'sqlite' and r.get_json()['media']['rawAvStorageAllowed'] is False"

  frontend-build-verify:
    name: Frontend Tests & Vite Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend test suite
        working-directory: frontend
        run: npm test

      - name: Build & verify free-tier static bundle (no raw A/V)
        working-directory: frontend
        run: npm run build && npm run build:verify

      - name: Upload built dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: mahjar-frontend-dist
          path: frontend/dist
          retention-days: 7

  deploy-free-tier:
    name: Trigger Free-Tier Deploy Hooks
    needs: [backend-verify, frontend-build-verify]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger optional Render / Vercel deploy hooks
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          fi
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
          fi
