services:
  - type: web
    name: mahjar-parents-api
    runtime: python
    plan: free
    buildCommand: pip install --no-cache-dir -r backend/requirements.txt
    startCommand: gunicorn --chdir backend -c backend/gunicorn.conf.py wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: MAHJAR_ENV
        value: production
      - key: MAHJAR_STORAGE_BACKEND
        value: sqlite
      - key: MAHJAR_DATA_DIR
        value: /opt/render/project/src/backend/instance
      - key: MAHJAR_MAX_MEDIA_STORAGE_BYTES
        value: "52428800"
      - key: MAHJAR_SERVE_FRONTEND
        value: "false"
      - key: MAHJAR_SECRET_KEY
        generateValue: true
      - key: MAHJAR_ADMIN_USERNAME
        value: admin
      - key: MAHJAR_ADMIN_PASSWORD_HASH
        sync: false
      - key: MAHJAR_CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: mahjar-parents-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build && npm run build:verify
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
